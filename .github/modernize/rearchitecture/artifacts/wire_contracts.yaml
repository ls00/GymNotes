contracts:
  - name: User registration
    unit: api-auth
    type: rest
    stability: must_preserve
    source_loc: "backend/src/main/java/com/gymnotes/controller/AuthController.java:26"
    contract:
      method: "POST"
      path: "/api/v1/auth/register"
      request: "RegisterRequestDTO; bean validation enabled"
      response: "201 AuthResponseDTO {token, refreshToken, tokenType, expiresIn, user}"
      error: "400 validation; 409 duplicate email"
      auth: "Public"
    target_contract:
      method: "POST /api/v1/auth/register(RegisterRequestDTO) -> 201 AuthResponseDTO"
      notes: "Current response and status shape; no API migration target was requested."
    semantic_divergence: []

