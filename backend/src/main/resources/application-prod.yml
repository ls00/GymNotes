spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

gymnotes:
  api:
    public-url: ${API_PUBLIC_URL:https://gymnotes-api.vercel.app}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      secret: ${JWT_SECRET}
