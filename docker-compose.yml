services:
  postgres:
    image: postgres:16-alpine
    container_name: gymnotes-postgres
    restart: always
    environment:
      POSTGRES_DB: gymnotes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-not-for-production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gymnotes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymnotes_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gymnotes-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gymnotes-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: gymnotes-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gymnotes_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-local-only-not-for-production}
      JWT_SECRET: ${JWT_SECRET:-local-only-not-for-production-gymnotes-jwt-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gymnotes-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gymnotes-network:
    driver: bridge
